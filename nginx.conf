server {
    listen 80;
    server_name thelagaribd.com www.thelagaribd.com;
    client_max_body_size 50M;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://static.cloudflareinsights.com https://apis.google.com https://www.gstatic.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://res.cloudinary.com https://images.unsplash.com https://www.sslcommerz.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com; child-src 'self' https://*.firebaseapp.com; connect-src 'self' *;" always;

    # Cloudflare Real IP Restoration (CRITICAL for Rate Limiting)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Frontend (Static Files)
    location / {
        root /var/www/thelagari/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Static Asset Caching (Aggressive)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2?|eot|ttf|otf)$ {
        root /var/www/thelagari/client/dist;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://static.cloudflareinsights.com https://apis.google.com https://www.gstatic.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://res.cloudinary.com https://images.unsplash.com https://www.sslcommerz.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com; child-src 'self' https://*.firebaseapp.com; connect-src 'self' *;" always;
    }

    # Admin Entry Point (Obfuscated)
    location /master {
        root /var/www/thelagari/client/dist;
        try_files $uri $uri/ /index.html;
    }

    # Admin Dashboard Protection
    location /admin {
        # allow YOUR_IP_HERE;
        # deny all;
        root /var/www/thelagari/client/dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/admin {
        # allow YOUR_IP_HERE;
        # deny all;
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API Proxy
    location /api/ {
        proxy_pass http://localhost:5001; # Matches PORT in server/.env
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Dynamic Product Sitemap — proxied to Express backend
    location = /sitemap-products.xml {
        proxy_pass http://localhost:5001/sitemap-products.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type "application/xml";
    }

    # Self-hosted product/category image uploads — served directly by Nginx
    # Files live at /var/www/thelagari/server/uploads/ on disk
    # Nginx serves them directly (no Node.js overhead) with aggressive caching
    location /uploads/ {
        alias /var/www/thelagari/server/uploads/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        # Security: only serve image file types from this directory
        location ~* \.(jpg|jpeg|png|webp|gif|svg|ico)$ {
            alias /var/www/thelagari/server/uploads/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
    }
}
