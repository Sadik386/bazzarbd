version: '3.8'

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: bazzarbd-pgvector
    restart: always
    environment:
      POSTGRES_USER: bazzar_user
      POSTGRES_PASSWORD: bazzar_password
      POSTGRES_DB: bazzar_vectors
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data:
